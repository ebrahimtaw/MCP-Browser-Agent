execution_engine: asyncio
logger:
  transports: [console]
  level: info
  progress_display: false

mcp:
  servers:
    playwright:
      # Invoke the binary installed globally in the image. The previous
      # `npx -y @playwright/mcp@latest` downloaded a fresh copy on every cold
      # start, whose bundled playwright-core wanted a Chromium revision that
      # was never installed at build time -> "Executable doesn't exist".
      command: "playwright-mcp"
      args:
        - "--headless"
        - "--no-sandbox"        # required: the container runs as root
        - "--browser"
        - "chromium"
        - "--isolated"          # in-memory profile, nothing leaks between runs
        - "--config"
        # Chromium needs --disable-dev-shm-usage in containers: the default
        # 64 MB /dev/shm makes it crash on content-heavy pages. Relative path: the
        # server inherits our cwd (repo root locally, /app in the container).
        - "playwright-mcp.config.json"
        - "--timeout-navigation"
        - "45000"
        - "--timeout-action"
        - "15000"

openai:
  default_model: "gpt-4o-mini"
