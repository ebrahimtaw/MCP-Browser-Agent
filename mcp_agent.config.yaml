execution_engine: asyncio
logger:
  transports: [console]
  level: info
  progress_display: false

mcp:
  servers:
    playwright:
      command: "npx"
      args:
        - "-y"
        - "@playwright/mcp@latest"
        - "--headless"
        - "--no-sandbox"
        - "--browser"
        - "chromium"
        - "--isolated"

openai:
  default_model: "gpt-4o-mini"
